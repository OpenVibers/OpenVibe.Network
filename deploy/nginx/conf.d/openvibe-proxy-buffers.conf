# Installed at /etc/nginx/conf.d/ on the host (applies to every OpenVibe vhost).
# Sign-in responses carry several JWT cookies (token, ov_token, refresh, hints); nginx's 4k
# default upstream header buffer answered them with "502 upstream sent too big header".
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
