# ═══════════════════════════════════════════════════════════════
# The openvibe.network subdomains that are not products of their own (REFERENCE).
#
# Each one answers a permanent redirect to the page on openvibe.network that does its job. They served
# OpenVibe.Sites placeholder pages until 2026-10-09 (plan T11: Sites is deleted).
#   status.  → openvibe.network/status
#   themes.  → openvibe.network/themes
#   admin.   → openvibe.network/admin
#   auth.    → openvibe.network<path> (sign-in, OAuth and discovery live on the apex)
#   api.     → openvibe.network<path>; its front page → openvibe.services (the developer console and docs)
#
# Install: sudo ov-vhost-install deploy/nginx/network-subdomains.conf network-subdomains.conf
# after removing Sites' admin/api/auth/status/themes.openvibe.network.conf (two files may not claim one name).
# Certificate: the *.openvibe.network wildcard at /etc/letsencrypt/live/openvibe.network/.
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name status.openvibe.network themes.openvibe.network admin.openvibe.network auth.openvibe.network api.openvibe.network;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.openvibe.network;
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    access_log off;
    return 301 https://openvibe.network/status;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name themes.openvibe.network;
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    access_log off;
    return 301 https://openvibe.network/themes;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.openvibe.network;
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    access_log off;
    return 301 https://openvibe.network/admin;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.openvibe.network;
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    access_log off;
    return 301 https://openvibe.network$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.openvibe.network;
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    access_log off;
    location = / { return 301 https://openvibe.services/; }
    location / { return 301 https://openvibe.network$request_uri; }
}
