# ═══════════════════════════════════════════════════════════════
# openvibe.network — Nginx Configuration (REFERENCE)
#
# NOTE: This file is a REFERENCE template.
# Production configs can also be generated and applied via the
# openvibe.network admin panel (Deploy → Nginx).
#
# Proxy to the openvibe-network Node.js server on port 4000.
# Certificate: /etc/letsencrypt/live/openvibe.network/
# my.openvibe.network is legacy and 301s to the apex.
# ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=openvibenetwork_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=openvibenetwork_auth:10m rate=5r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.network my.openvibe.network;
    return 301 https://openvibe.network$request_uri;
}

# ── Legacy my. subdomain → apex ────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;

    return 301 https://openvibe.network$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;

    access_log /var/log/nginx/openvibe.network.access.log;
    error_log  /var/log/nginx/openvibe.network.error.log;

    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Auth endpoints (strict rate limit) ──────────────────
    location ~ ^/(api/auth/(register|login|anon-session)|oauth/(token|authorize)) {
        limit_req zone=openvibenetwork_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Shared static assets (long cache, CORS *) ───────────
    location /shared/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API (moderate rate limit) ───────────────────────────
    location /api/ {
        limit_req zone=openvibenetwork_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Internal API (server-to-server only, never public) ──
    location /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Static / SPA ────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
