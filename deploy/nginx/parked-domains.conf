# openvibe.my: the account hub's home since 2026-11-07, served by OpenVibe.Network on 127.0.0.1:4000, which
# serves the hub at / (and its sections at /<section>) and its own sign-in at /auth. openvibe.network/my,
# /my/* and the hub's other old paths 301 there from the app; www.openvibe.my is not a second home and 301s to
# the apex here, and the app does the same for a request that reaches it on the www host.
#
# The account hub's API is not proxied here: its pages call https://openvibe.network/api/v1/me/* with the
# person's Bearer token (Network's CORS allows this origin), and the app sends a stray /api/ request there too.
# The TLS certificate is the name's own; the Cloudflare real-IP map is the host-wide
# /etc/nginx/conf.d/cloudflare-realip.conf, so $remote_addr here is the visitor's address, not Cloudflare's.
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.my www.openvibe.my;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.my$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.my;
    ssl_certificate     /etc/letsencrypt/live/openvibe.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.my/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log off;
    return 301 https://openvibe.my$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.my;
    include snippets/security-txt.conf;
    ssl_certificate     /etc/letsencrypt/live/openvibe.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.my/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/openvibe.my.access.log;
    error_log  /var/log/nginx/openvibe.my.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~* ^/(metrics|internal)(/|$) { return 404; }

    # Inventory keeps its prefix: the app serves assets, forms and SSO under it.
    # ^~ bypasses outer regex locations, so private endpoints are denied here too.
    location ^~ /inventory {
        if ($uri ~* "^/inventory/(internal|metrics)(/|$)") { return 404; }
        if ($uri ~ "^/inventory/\\.(?!well-known)") { return 404; }
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:5030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The hub's page, its sections, its /auth sign-in and every shared asset the page loads (css, js, shared,
    # img, fonts, icons, manifest, service worker) are Network's own responses for this Host.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# openvibe.link: OpenVibe Link's home since 2026-11-07, served by OpenVibe.Network on 127.0.0.1:4000, which
# renders the Link page when the Host is openvibe.link. The old machines subdomain of openvibe.network 301s there from the
# app (except /install, which keeps serving the installer); www.openvibe.link is not a second home and 301s to
# the apex here, and the app does the same for a request that reaches it on the www host.
#
# The TLS certificate is the name's own (it covers *.openvibe.link); the Cloudflare real-IP map is the host-wide
# /etc/nginx/conf.d/cloudflare-realip.conf, so $remote_addr here is the visitor's address, not Cloudflare's.
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.link www.openvibe.link;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.link$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.link;
    ssl_certificate     /etc/letsencrypt/live/openvibe.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.link/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log off;
    return 301 https://openvibe.link$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.link;
    include snippets/security-txt.conf;
    ssl_certificate     /etc/letsencrypt/live/openvibe.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.link/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/openvibe.link.access.log;
    error_log  /var/log/nginx/openvibe.link.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~* ^/(metrics|internal)(/|$) { return 404; }

    # Link's page, its installer and add-computer redirects, machines and pairing signposts, Markdown twin and agent files.
    location ~ ^/api/v1/me/nodes/(send-keys|send)(/.*)?$ {
        # Link Send from the browser: the key list (GET), the outbox (GET), one encrypted file (POST, up to 20 MB
        # before base64) and the resumable parts of it (PUT).
        limit_except GET HEAD POST PUT { deny all; }
        client_max_body_size 40m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    # The machine hub on openvibe.link/machines is Network's page, so its API is Network's too, on the host-only
    # session this host signs in with: the machines list, the owner's controls and the live screen, plus machine pools.
    # The page's own session bootstrap (my/core.js: /api/auth/me and the refresh it tries): the hub keeps its
    # Network session in the host-only ov_token cookie and hydrates from here before any machine is asked for.
    location ^~ /api/auth/ {
        limit_except GET HEAD POST PUT PATCH DELETE { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    # The machine hub on openvibe.link/machines is Network's page, so its API is Network's too, on the host-only
    # session this host signs in with: the machines list, the owner's controls and the live screen, plus machine pools.
    location ~ ^/api/v1/(machines|machine-pools)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/(|install|add-computer(/complete)?|machines(/.*)?|pair|index\.md|send\.js|egress-settings\.js|locker\.mjs|llms\.txt|llms-full\.txt|robots\.txt|sitemap\.xml|\.well-known/agent\.json)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Link's own sign-in (Network#664: the link-web OAuth client; a host-only session on openvibe.link): login,
    # the callback, the session read, refresh and the sign-out form. Without it the catch-all sent /auth/* to
    # openvibe.network, so openvibe.link never signed anyone in (11-08 audit).
    location ^~ /auth/ {
        limit_except GET HEAD POST { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    # The IndexNow key file (openvibe-shared/indexnow): /<key>.txt, served by Network when INDEXNOW_KEY is set.
    location ~ "^/[A-Za-z0-9]{8,128}\.txt$" {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Static assets the page loads (content-hashed by Network).
    location ~ ^/(css|js|shared|img|fonts|icons|favicon)[/.] {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Everything else is openvibe.network's (sign-in, the account hub, the API).
    location / { return 301 https://openvibe.network$request_uri; }
}

