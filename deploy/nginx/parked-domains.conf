# ═══════════════════════════════════════════════════════════════
# Parked domains (REFERENCE): owned by the network, no product serves them yet.
#
# A parked domain has no page of its own (plan rule: no placeholders). It answers a temporary redirect
# to the network's front door, so a visitor lands somewhere real instead of on a TLS or 52x error, and
# the redirect goes away the day the product's own vhost takes the name. Until 2026-10-09 these served
# OpenVibe.Sites placeholder pages (plan T11: Sites is deleted).
#   openvibe.zone left on 2026-10-14: OpenVibe.Zone serves it (OpenVibe.Zone deploy/nginx/openvibe.zone.conf).
#   openvibe.tips and openvibe.vip left on 2026-10-17, with the Billing cutover: OpenVibe.Tips and OpenVibe.VIP serve them
#     (OpenVibe.Tips deploy/nginx/openvibe.tips.conf, OpenVibe.VIP deploy/nginx/openvibe.vip.conf).
#   openvibe.website left on 2026-10-31: OpenVibe.Space answers the apex with OpenVibe.Website's front door
#     (OpenVibe.Space deploy/nginx/openvibe.website.conf, which also serves the tenant sites at *.openvibe.website).
#   openvibe.homes left on 2026-10-15: OpenVibe.Homes is served by OpenVibe.Rent (OpenVibe.Rent deploy/nginx/openvibe.homes.conf).
#   openvibe.run left on 2026-10-11: OpenVibe.Run serves it (OpenVibe.Run deploy/nginx/openvibe.run.conf).
#   realtime.openvibe.network: OpenVibe.Realtime is closed; delivery is OpenVibe.Events.
#   openvibe.report left on 2026-10-28: OpenVibe.Report serves it (OpenVibe.Report deploy/nginx/openvibe.report.conf).
#   openvibe.domains left on 2026-10-28: OpenVibe.Domains serves it (OpenVibe.Domains deploy/nginx/openvibe.domains.conf).
#   openvibe.vision left on 2026-10-28: OpenVibe.Vision serves it (OpenVibe.Vision deploy/nginx/openvibe.vision.conf).
#   openvibe.exchange left on 2026-10-28: OpenVibe.Exchange serves it (OpenVibe.Exchange deploy/nginx/openvibe.exchange.conf).
#   openvibe.fun left on 2026-10-28: OpenVibe.Fun serves it (OpenVibe.Fun deploy/nginx/openvibe.fun.conf).
#   openvibe.cam left on 2026-10-28: OpenVibe.Cam serves it (OpenVibe.Cam deploy/nginx/openvibe.cam.conf).
#   2026-10-28: the thirteen domains bought that day (open.shoes and twelve openvibe.*) are parked here, each sent to
#     where its capability lives today, until its room's own vhost takes the name (plan: OpenVibe_New_Domains_Plan).
#
# Install: sudo ov-vhost-install deploy/nginx/parked-domains.conf parked-domains.conf
# after removing Sites' vhost for each name. Each name uses its own certificate (a vhost must use its own
# name's certificate, or Cloudflare answers 526).
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name realtime.openvibe.network;
    return 302 https://openvibe.network/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name realtime.openvibe.network;
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    access_log off;
    return 302 https://openvibe.network/;
}

# open.shoes is served by OpenVibe.Shoes since 2026-10-31 (its own vhost, deploy/nginx/open.shoes.conf).

# openvibe.vision is served by OpenVibe.Vision since 2026-10-28 (its own vhost, deploy/nginx/openvibe.vision.conf).

# openvibe.domains is served by OpenVibe.Domains since 2026-10-28 (its own vhost, deploy/nginx/openvibe.domains.conf).

# openvibe.report is served by OpenVibe.Report since 2026-10-28 (its own vhost, deploy/nginx/openvibe.report.conf).

# openvibe.casino is served by OpenVibe.Casino since 2026-10-31 (its own vhost, deploy/nginx/openvibe.casino.conf).

# openvibe.fun is served by OpenVibe.Fun since 2026-10-28 (its own vhost, deploy/nginx/openvibe.fun.conf).

# openvibe.tours is served by OpenVibe.Tours since 2026-10-31 (its own vhost, deploy/nginx/openvibe.tours.conf).

