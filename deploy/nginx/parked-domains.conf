# openvibe.directory: parked, sent to the network's front door (no directory capability yet) until its own vhost takes the name (2026-11-10).
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.directory www.openvibe.directory;
    return 302 https://openvibe.network/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.directory www.openvibe.directory;
    ssl_certificate     /etc/letsencrypt/live/openvibe.directory/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.directory/privkey.pem;
    access_log off;
    return 302 https://openvibe.network/;
}
