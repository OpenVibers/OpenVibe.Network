<meta name="theme-color" content="#0d131d">
<meta name="color-scheme" content="dark light">
<link rel="apple-touch-icon" href="/assets/logo-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-primary:#0a0f1c;--bg-secondary:#101828;--bg-card:#131c2e;--border:#1f2d47;--text-primary:#e8ecf5;--text-secondary:#a9b3c9;--text-muted:#6b7590;--accent:#3b82f6;--accent-light:#60a5fa;--accent-rgb:59,130,246;--on-accent:#fff;--success:#22c55e}
html,body{height:100%}
body{background:var(--bg-primary);color:var(--text-primary);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:30px 28px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:-50% -20% auto;height:80%;background:radial-gradient(60% 60% at 50% 40%,rgba(var(--accent-rgb),.2),transparent 70%);pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px;position:relative}
.head h1{font-size:18px;letter-spacing:-.2px}
.head p{font-size:13px;color:var(--text-secondary);margin-top:2px}
.bar{height:4px;border-radius:4px;background:rgba(var(--accent-rgb),.15);overflow:hidden;margin-bottom:16px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:var(--w,0%);background:linear-gradient(90deg,var(--accent),var(--accent-light));transition:width .45s cubic-bezier(.2,.8,.2,1);border-radius:4px}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 1.2s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
ul{list-style:none;position:relative}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--text-secondary);transition:background .2s,color .2s}
li .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);font-size:12px;color:var(--text-muted);flex:none;transition:all .25s}
li.done{color:var(--text-primary)}
li.done .dot{background:var(--success);border-color:var(--success);color:#fff;animation:pop .45s cubic-bezier(.2,1.6,.3,1)}
li.skip .dot{color:var(--text-muted)}
li.now{background:rgba(var(--accent-rgb),.08);color:var(--text-primary)}
li.now .dot{border-color:var(--accent);color:var(--accent-light)}
li.now .dot i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--text-muted);position:relative}
.foot a{color:var(--accent-light);text-decoration:none;font-weight:600}
.ov-mark{width:38px;height:38px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="card" aria-live="polite">
  <div class="head"><span class="ov-mark" data-size="38"></span><div><h1 id="h">Signing you in across OpenVibe</h1><p id="p">One account, every site — this takes a moment.</p></div></div>
  <div class="bar"><i id="bar"></i></div>
  <ul id="list"></ul>
  <div class="foot"><span id="note">Each site gets its own session; nothing is shared between them.</span><a id="skip" href="/">Skip</a></div>
</section>
<script src="/shared/ov-mark.js" async></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const action = q.get('action') === 'logout' ? 'logout' : 'login';
  const skipId = q.get('skip') || '';
  const step = Math.max(0, parseInt(q.get('step') || '0', 10) || 0);
  const doneIds = (q.get('done') || '').split(',').filter(Boolean);
  const skippedIds = (q.get('skipped') || '').split(',').filter(Boolean);
  const nextRaw = q.get('next') || '/';
  // safe-redirect:begin
  // Where a sign-in may send the browser: a path on this site, this origin, or https on a zone
  // OpenVibe owns (server/auth/sso-owned.js). Never javascript:/data:, never another host.
  const OV_OWNED_ZONES = ['openvibe.network', 'openvibe.live', 'openvibe.tools', 'openvibe.media', 'openvibe.games', 'openvibe.community', 'openvibe.chat', 'openvibe.codes', 'openvibe.blog', 'openvibe.wiki', 'openvibe.news', 'openvibe.reviews', 'openvibe.tips', 'openvibe.vip', 'openvibe.trade', 'openvibe.host', 'openvibe.deals', 'openvibe.coupons', 'openre.stream'];
  function safeNext(raw) {
      const s = String(raw == null ? '' : raw);
      if (!s || /[\\\u0000-\u001f\u007f]/.test(s)) return '/';
      if (s.startsWith('/') && !s.startsWith('//')) return s;
      try {
          const u = new URL(s);
          if (u.username || u.password) return '/';
          if (u.origin === window.location.origin) return u.toString();
          const h = u.hostname.toLowerCase();
          if (u.protocol === 'https:' && OV_OWNED_ZONES.some(z => h === z || h.endsWith('.' + z))) return u.toString();
          const local = /^(localhost|127\.0\.0\.1)$/;
          if (u.protocol === 'http:' && local.test(h) && local.test(window.location.hostname)) return u.toString();
      } catch (e) { /* not a URL */ }
      return '/';
  }
  // safe-redirect:end
  const next = safeNext(nextRaw);
  document.getElementById('skip').href = next;
  if (action === 'logout') { document.getElementById('h').textContent = 'Signing you out everywhere'; document.getElementById('p').textContent = 'Closing your session on every OpenVibe site.'; }

  const list = document.getElementById('list'), bar = document.getElementById('bar');
  const hasNetworkSession = () => /(^|; )ov_token=/.test(document.cookie);
  const finish = () => {
    try { localStorage.setItem('ov_sso_hint', action === 'login' ? 'account' : 'guest'); } catch (e) { /* */ }
    if (action === 'logout') {
      // The network's own session goes last, after every site had its turn.
      try { for (const k of ['ov_token', 'openvibe_accounts', 'openvibe_active_account', 'openvibe_anon_token', 'openvibe_anon_tokens']) localStorage.removeItem(k); } catch (e) { /* */ }
      document.cookie = 'ov_token=;path=/;max-age=0;SameSite=Lax;Secure';
      try { fetch('/api/auth/logout', { method: 'POST', credentials: 'include', keepalive: true }).catch(() => {}); } catch (e) { /* */ }
    }
    location.replace(next);
  };

  fetch('/api/sso/targets', { cache: 'no-store' }).then(r => r.json()).then(({ targets }) => {
    let all = (targets || []).filter(t => t.id !== skipId && (action === 'login' ? t.login : t.logout));
    if (!all.length || (action === 'login' && !hasNetworkSession())) return finish();
    const idx = Math.min(step, all.length);
    list.innerHTML = all.map((t, i) => {
      const st = doneIds.includes(t.id) ? 'done' : skippedIds.includes(t.id) ? 'skip' : i === idx ? 'now' : '';
      const ico = st === 'done' ? 'fa-check' : st === 'skip' ? 'fa-minus' : st === 'now' ? 'fa-circle-notch' : 'fa-circle';
      return `<li class="${st}" data-id="${t.id}"><span class="dot"><i class="fa-solid ${ico}"></i></span><span>${t.name}</span></li>`;
    }).join('');
    bar.style.setProperty('--w', Math.round((idx / all.length) * 100) + '%');
    if (idx >= all.length) { bar.style.setProperty('--w', '100%'); return setTimeout(finish, 450); }

    const t = all[idx];
    // Mark the previous hop done (the hop that sent us here is idx-1 unless it was skipped).
    const cont = (extra) => {
      const u = new URL('/sso/fanout', location.origin);
      u.searchParams.set('action', action); u.searchParams.set('next', next); if (skipId) u.searchParams.set('skip', skipId);
      u.searchParams.set('step', String(idx + 1));
      u.searchParams.set('done', doneIds.concat(extra.done || []).join(','));
      u.searchParams.set('skipped', skippedIds.concat(extra.skipped || []).join(','));
      return u.toString();
    };
    // A site that is down would strand the browser on its error page: probe it first (an opaque
    // no-cors response resolves; a connection failure rejects) and skip it when it does not answer.
    const probe = new Promise((resolve) => {
      const c = new AbortController(); const tm = setTimeout(() => { c.abort(); resolve(false); }, 2500);
      fetch((t.origin || new URL(t.login).origin) + '/', { mode: 'no-cors', cache: 'no-store', signal: c.signal }).then(() => { clearTimeout(tm); resolve(true); }).catch(() => { clearTimeout(tm); resolve(false); });
    });
    probe.then((up) => {
      if (!up) { location.replace(cont({ skipped: [t.id] })); return; }
      const hop = (action === 'login' ? t.login : t.logout).replace('{next}', encodeURIComponent(cont({ done: [t.id] })));
      setTimeout(() => location.replace(hop), 250);
    });
  }).catch(finish);

  // Hard stop: never hold the user more than 20s on this page.
  setTimeout(finish, 20000);
})();
</script>
</body>
</html>
